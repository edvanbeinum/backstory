# The capabilities Backstory already has, for new work to build from.
# Build from these. If none fits, extend one. Ask before adding a new one.
# `block` names a block in language.yaml; code in no block leaves it out.
# The idea of naming primitives comes from https://kcd-slides-event-mega-its-time.pages.dev

primitives:
  - name: run git
    block: git reader
    file: lib/exec.ts
    symbols:
      - git
      - gitTry
      - gitLine
    use: "Every git call. It turns off the pager and credential prompts, so a request never hangs. Read patches through `patches`, whose flags keep the user's diff config out."
  - name: run a binary
    block: git reader
    file: lib/exec.ts
    symbols:
      - run
      - refreshLoginShellDirs
    use: "Every other child process. It passes argv and never a shell, and extends PATH so binaries resolve under the Mac app or launchd: the usual tool folders, plus the folders the user's login shell finds `gh` and `claude` in (nvm and the like), asked once per server before the first `gh` or `claude` call. `refreshLoginShellDirs` asks again."
  - name: open a repo
    block: git reader
    file: lib/git.ts
    symbols:
      - resolveRepo
    use: "Turns a path into a `RepoInfo`, throwing a typed `RepoError` the routes can report."
  - name: fetch a branch
    block: git reader
    file: lib/fetch.ts
    symbols:
      - fetchBranch
    use: "The one place Backstory writes refs. Fetches a branch and its base from origin into remote-tracking refs, then creates the local branch, or moves it when it has nothing of its own. It never moves a branch a worktree has checked out, or one with commits origin doesn't have. A github.com https remote signs in with Connect GitHub's token first, then git's own credentials."
  - name: a repo's key
    block: git reader
    file: lib/git.ts
    symbols:
      - repoKey
      - repoKeyOf
      - gitCommonDir
    use: "The folder name a repo gets under `~/.backstory/flows/`, `data/`, `maps/`, `descriptions/` and `models/`: the main checkout's folder plus a hash of the common git dir, the same from every worktree and different for two repos with the same folder name."
  - name: a view's commits
    block: git reader
    file: lib/view.ts
    symbols:
      - viewRange
      - onBranchOnly
    use: "The same base and head that `/api/diff` diffs, so every view of a change agrees on its commits. All changes runs to `repo.tip`, so a branch opened with `ref` is read at its own tip, not the checkout's. `onBranchOnly` says whether a commit is one of the branch's own, past that base."
  - name: patches
    block: git reader
    file: lib/git.ts
    symbols:
      - getCommitPatch
      - getRangePatch
      - getWorkingPatch
    use: The patch text Backstory parses everywhere, with flags that keep a user's difftool config out of it.
  - name: not yet pushed
    block: git reader
    file: lib/pushed.ts
    symbols:
      - pushedState
    use: The one definition of "unpushed".
  - name: file at a commit
    block: model reader (the map)
    file: lib/model.ts
    symbols:
      - showFile
    use: Reads one file at a commit, or null when it isn't there. The data model reader already reuses it.
  - name: parse a diff
    block: diff and anchors
    file: lib/diff.ts
    symbols:
      - parseUnifiedDiff
    use: One parser for every diff.
  - name: put threads on lines
    block: diff and anchors
    file: lib/anchor.ts
    symbols:
      - anchorThreads
    use: Puts each review thread on its line, with the rule that never silently drops a thread.
  - name: highlight
    block: diff and anchors
    file: lib/highlight.ts
    symbols:
      - highlightFiles
    use: Shiki, in both themes, with line caps.
  - name: ask GitHub
    block: GitHub
    file: lib/github.ts
    symbols:
      - gh
      - githubGraphql
    use: "Every GitHub GraphQL read, through `githubGraphql`: with the token Connect GitHub saved in the Keychain when there is one and the remote is github.com (or an ssh alias for it), through `gh` otherwise. A token GitHub refuses is forgotten, and any failed read on the token is tried again through `gh`. `gh` runs any other `gh` call, such as finding a branch's PR with `gh pr list`, with the pager and colour off and a timeout."
  - name: PR and threads
    block: GitHub
    file: lib/github.ts
    symbols:
      - loadGitHubDataCached
    use: A branch's PR, threads and reviews, cached, degrading to "unavailable" instead of throwing.
  - name: store
    block: store
    file: lib/store.ts
    symbols:
      - db
      - transaction
      - reading
      - homeDir
      - KEY
      - setting
      - setSetting
    use: "Every read and write of notes, rounds, seen sessions, settings and the branch tips you last looked at, in the SQLite database `~/.backstory/backstory.db`. `db` opens it on first use, makes the schema from `lib/schema.sql` and upgrades an older database from `lib/upgrades/<version>.sql`; `transaction` runs a synchronous write in one transaction, joining one already open, so a module's write can be part of a larger one; `reading` runs a read and returns an empty result when the database can't be opened or read. `homeDir` is the one directory everything on this machine lives in (the database, the flow cache, the data cache, the map cache, local models). `KEY` is the shape of an id the store accepts. `setting` and `setSetting` read and write one setting, such as `read.off.<repoKey>`."
  - name: run the AI provider
    block: AI provider
    file: lib/ai/provider.ts
    symbols:
      - aiProvider
      - AI_PROVIDERS
      - providerGap
    use: "Every AI call: `aiProvider().run` reads a directory read-only and answers in a JSON schema, and `status` says whether it's missing, logged out or ready. `providerGap` turns a status into the reason a run didn't start, which `ClaudeCodeNotice` shows. Nothing outside `lib/ai/` imports a provider; `lib/ai/claude.ts` is the only `claude -p` call site."
  - name: a commit's files
    block: flow engine
    file: lib/flows/generate.ts
    symbols:
      - withSnapshot
    use: "A commit's tracked files in a temp dir, for Claude to read: none of the worktree's untracked, ignored or uncommitted files."
  - name: steps on lines
    block: flow engine
    file: lib/flows/rows.ts
    symbols:
      - stepMarks
      - stepsAt
      - fileFlows
    use: 'Where flows meet the diff''s lines. `stepMarks` is every flow''s steps by file and line, as `1·7` marks for the gutter; `stepsAt` is the one step a line is on, for a comment''s badge and its place in the story; `fileFlows` is each file''s flows, or "read yourself" for app code on none.'
  - name: read the C4 model
    block: model reader (the map)
    file: lib/model.ts
    symbols:
      - readModelAt
    use: "One reader for the C4 model at a commit, in this order: the committed `architecture/workspace.dsl`, a hand-written local model, the drafted map saved for the commit's tree. `source` says which. A local model with the `backstory.drafted` property is the old single drafted model, and is skipped."
  - name: draft the map
    block: model reader (the map)
    file: lib/models/cache.ts
    symbols:
      - mapStatus
      - startMapRead
      - mapReadSettled
      - startMapTrunkRead
      - mapRefusal
      - savedMapAt
      - hasMainMap
      - mapTrunkStatus
    use: "The AI provider's drafted map for a repo with no committed or hand-written model: main read in full once (`startMapTrunkRead`), then each view's base derived forward from main's map and its head from its base, one small read each that returns only what the patch changed (`lib/models/delta.ts`), cached by tree under `~/.backstory/maps/`, one read at a time. The data model's engine, copied with its own queue. Reads start as repos and views open, unless `autoRead(root)` says the repo is turned off, or on a click. `readModelAt` reads the saved map through `savedMapAt`; `hasMainMap` says whether main's map is saved. Uncommitted work reads and reports HEAD's own view, the one whose map it is drawn on. A running read's status has its `step`, which of the trees it reads it is on, counting main's when it waits on main; `mapTrunkStatus` is main's read, with `big` for a repo of `BIG_REPO_FILES` tracked files or more."
  - name: data readers
    block: data model reader
    file: lib/data/readers.ts
    symbols:
      - DATA_READERS
      - readDataModel
    use: "The formats a data model is read from, in order; the first that finds one at a commit wins. A new format is one file in `lib/data/` with a `DataReader`, and one line in `DATA_READERS`. Steered by `data.files` and `data.format`."
  - name: draft the data model
    block: data model reader
    file: lib/data/cache.ts
    symbols:
      - dataStatus
      - startDataRead
      - dataReadSettled
      - startTrunkRead
      - autoRead
      - setAutoRead
      - dataTrunkStatus
      - bigRepo
    use: "The AI provider's reading of a data model no reader finds: main read in full once (`startTrunkRead`), then each view's base derived forward from main's model and its head from its base, one small read each, cached by tree under `~/.backstory/data/`, one read at a time. Reads start as repos and views open, unless `autoRead(root)` says the repo is turned off, or on a click. The switch is per repo, on by default, shared by every worktree, and covers drafted maps and change descriptions too. Told which files have the model when `data.files` is set. Each model also has a `storage` sentence, where the records are kept, what one stored unit is and when it is written, which `buildData` puts on the drafted response. `buildData` falls back to it. A running read's status has its `step`, as the map's does; `dataTrunkStatus` is main's read, with `big` from `bigRepo`, which counts tracked files against `BIG_REPO_FILES`."
  - name: describe a change
    block: change description
    file: lib/description/cache.ts
    symbols:
      - descriptionStatus
      - startDescription
    use: "The AI provider's change description for a view: what it does, why, and at most two places to look first, and one sentence per changed component for Story's walk, read from the view's patch (cut past the drafted reads' cap, with a `--stat`), commit messages, PR and the names of the components and entities it touches, through `withSnapshot`. Waits for the view's map and data model reads (`mapReadSettled`, `dataReadSettled`), starting them when the repo reads automatically, so the names are this commit's. The read joins the queue only once they end. Cached by base and head trees under `~/.backstory/descriptions/`, one read at a time. The schema and the prompt's writing rules are in `lib/description/prompt.ts`, so a read that adds to the description changes that one file."
  - name: route errors
    file: lib/api.ts
    symbols:
      - errorResponse
    use: "Turns any thrown error into the `ApiError` shape the UI renders."
  - name: refuse other sites
    file: lib/api.ts
    symbols:
      - crossSite
    use: Blocks a POST that another website sends to Backstory's local port.
  - name: URL state
    block: UI tabs
    file: lib/url.ts
    symbols:
      - buildUrl
      - writeUrlState
      - viewParams
      - viewKey
    use: "Builds and writes the page state into the URL, so a view can be shared, with `stop=` for the stop Story's walk is on and `walk=0` for Story on one page. `viewParams` builds every view request's query, with `ref` when the repo is open on a branch it hasn't checked out, and `viewKey` names a view from that query for state kept with it."
  - name: the open view
    block: UI tabs
    file: components/ViewContext.tsx
    symbols:
      - ViewProvider
      - useView
    use: "Gives the page's components the repo and the branch it's open on, so a view request or key never forgets `ref`. The page sets it from the session it has loaded."
  - name: buttons and copy
    block: UI tabs
    file: components/ui.tsx
    symbols:
      - Button
      - CopyButton
      - copyToClipboard
      - Ticked
    use: "The shared controls. A `Button` with `href` is a link that opens in a new window, which the Mac app hands to the browser. `Ticked` shows each `backticked` name in AI-written text in monospace."
  - name: Claude Code notice
    block: UI tabs
    file: components/ClaudeCodeNotice.tsx
    symbols:
      - ClaudeCodeNotice
    use: "The one message and button for Claude Code not installed (Get Claude Code) or logged out (Copy: claude auth login). Flows, the map's and the data model's drafts, the setup checklist and the Claude Code gate show it, so they never word it differently."
  - name: graph layout
    block: UI tabs
    file: components/graph.ts
    symbols:
      - layeredLayout
      - nestedLayout
      - edgePath
    use: "Lays out and draws the map and data diagrams. `nestedLayout` lays out boxes inside boxes, so the map draws components inside their containers and containers inside their systems. `edgePath` routes an arrow around the boxes between its ends."
