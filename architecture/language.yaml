# The words, building blocks and rules agents plan Backstory's changes with.

terms:
  - name: Backstory
    means: "The product: the Mac app, the server it runs, the page and the `backstory` command. It was called differ; that name stays only where it names the old thing: the `dev.differ.server` login agent the app removes, the `~/.differ` folder `homeDir` moves, and keys cached under it that are still read."
    avoid:
      - differ, for anything current
  - name: flow
    means: "What the code does for one user action a change touches: the data, the Flows tab and the feature."
    drawing: sequence
    avoid:
      - sequence, for the data
      - trace as a noun (trace stays the verb, as in "Trace this change")
  - name: participant
    means: One actor in a flow, a type the calls go between (`FlowParticipant`, SARIF `logicalLocations`).
    drawing: lane
    avoid:
      - lane, for the data
  - name: view
    means: 'The two commits being compared: one commit and its first parent, or "All changes" from the fork point to HEAD (`lib/view.ts`).'
    avoid:
      - view, for the Diff / Before / After switch
  - name: flow mode
    means: The Diff / Before / After switch on a flow (`FlowMode` in `lib/flows/rows.ts`).
    avoid:
      - view
  - name: column
    means: "A vertical region of the page. The side column (left: map strip, data strip, and the Flows and Comments tabs) and the diff column (the change picker and the diff)."
    avoid:
      - pane
      - rail
  - name: panel
    means: One tab's content inside the side column. The flows panel, the comments panel, and the response panel inside it.
    avoid:
      - pane
  - name: strip
    means: A one-line summary bar at the top of the side column that opens an overlay. The map strip and the data strip.
    avoid: []
  - name: Rails
    means: Ruby on Rails, one of the data readers.
    boundary: "`lib/data/` only"
    avoid:
      - rail, for any layout
  - name: data reader
    means: "One format a data model is read from: one entry in `DATA_READERS` (`lib/data/readers.ts`) and one file in `lib/data/`, such as `lib/data/rails.ts`."
    avoid: []
  - name: data steering
    means: "`data.files` and `data.format` in a workspace's properties: which files hold the data model, and which data reader reads them. Read at the head and used at both ends of a view."
    avoid: []
  - name: drafted data model
    means: "The AI provider's reading of a data model, for a repo no data reader understands (`lib/data/drafted.ts`). Read on a click and marked drafted wherever it's shown."
    avoid: []
  - name: data cache
    means: "`lib/data/cache.ts`: the drafted data models in `~/.backstory/data/`, one file per head tree and one per base..head delta, plus the queue of reads that make them."
    avoid:
      - store
  - name: store
    means: "`lib/store.ts`: the small click-driven JSON files in `~/.backstory` (`homeDir`), each read and written whole."
    avoid:
      - store, for the flow cache or the data cache
  - name: flow cache
    means: "`lib/flows/cache.ts`: one cached SARIF file per view in `~/.backstory/flows/`, plus the queue of runs that make them."
    avoid:
      - store
  - name: local model
    means: "A C4 model kept on this machine for a repo that doesn't commit one, at `~/.backstory/models/<repo>/workspace.dsl` (`localModelDir` in `lib/model.ts`). Claude can draft one (`lib/models/draft.ts`)."
    avoid:
      - draft alone, for the model (reply drafts are `lib/drafts.ts`)
  - name: AI provider
    means: "The tool Backstory asks to read code and answer in a JSON schema; Claude Code for now (`lib/ai/provider.ts`)."
    avoid:
      - agent (that's the coding agent under review, as in the agent review loop)
      - model, for the tool (that's the C4 or data model; the LLM is "the provider's model")
  - name: Mac app
    means: "The native app in `mac/` that owns the server: it starts Backstory's server from its bundle, shows the UI in a web view only while the server answers, and opens repos from `backstory://open?repo=` links."
    avoid:
      - shell (that's the command shell)
      - wrapper
  - name: attached
    means: "The Mac app showing a server it didn't start, through `-serverURL` or a build with no server in its bundle; the dev loop."
    avoid:
      - dev mode
      - override
  - name: primitive
    means: A named capability Backstory exposes for reuse, listed in `architecture/primitives.yaml`.
    avoid:
      - helper or utility, for a primitive (a helper is private to one file)

blocks:
  - name: git reader
    code:
      - lib/git.ts
      - lib/exec.ts
      - lib/browse.ts
      - lib/pushed.ts
      - lib/view.ts
    summary: Reads repos, commits, patches and the working tree through git, and works out what counts as not yet pushed.
    read: '`lib/git.ts` header, then README "How "not yet pushed" is decided"'
  - name: diff and anchors
    code:
      - lib/diff.ts
      - lib/anchor.ts
      - lib/highlight.ts
      - lib/snippet.ts
    summary: Parses and highlights diffs, and puts each review thread on the line it was written against.
    read: "`lib/anchor.ts`, the comment on `anchorThreads`"
  - name: GitHub
    code:
      - lib/github.ts
      - lib/inbox.ts
    summary: Pull requests and review threads through `gh`, degrading to "unavailable" rather than failing.
    read: '`lib/github.ts` header, then README "Three levels"'
  - name: store
    code:
      - lib/store.ts
      - lib/responses.ts
      - lib/drafts.ts
      - lib/notes.ts
      - lib/outbox.ts
    summary: The JSON files in `~/.backstory` and the modules that keep their records.
    read: "`lib/store.ts` header"
  - name: flow engine
    code:
      - lib/flows/
    summary: Traces a view's flows with the AI provider, checks each step against its line, and caches the result.
    read: '`lib/flows/generate.ts` header, then README "Diagrams: the map, the data model and flows"'
  - name: AI provider
    code:
      - lib/ai/
    summary: "The one seam every AI call goes through: picks the provider (`BACKSTORY_AI`, Claude Code by default) and holds the contract a provider must meet, reading a directory read-only and answering in a JSON schema."
    read: "`lib/ai/provider.ts` header"
  - name: model reader (the map)
    code:
      - lib/dsl.ts
      - lib/model.ts
      - lib/map.ts
      - lib/models/
    summary: Reads the repo's C4 model from its Structurizr DSL and marks the components a change touched, added or removed. Has Claude draft a local model for a repo with none.
    read: "`lib/model.ts` header"
  - name: data model reader
    code:
      - lib/data/
    summary: Reads the data model at both ends of a view and diffs it, with the first data reader that finds one, or the drafted data model.
    read: '`lib/data/build.ts` header, then README "Diagrams: the map, the data model and flows"'
  - name: agent review loop
    code:
      - lib/review.ts
      - lib/feedback.ts
      - lib/outbox.ts
      - bin/hook.mjs
    summary: Notes on an agent's work, sent to a waiting `backstory review` or queued for the agent's Stop hook.
    read: 'README "Reviewing an agent''s work"'
  - name: live updates
    code:
      - app/api/watch/
      - components/useStaleReload.ts
    summary: Watches the worktree and git dir and pushes change events to the window over SSE.
    read: "`app/api/watch/route.ts` header"
  - name: UI columns and panels
    code:
      - app/page.tsx
      - components/
      - lib/recents.ts
    summary: The page, its side column and diff column, the panels and strips inside them, and the recent repos kept in the browser's localStorage.
    read: "`components/SideColumn.tsx`, the comment on `SideColumn`"
  - name: CLI
    code:
      - bin/backstory.mjs
      - bin/macapp.mjs
      - packaging/
    summary: The `backstory` command, which opens a repo in the Mac app (launching it when it isn't running) or `backstory review`'s wait for notes, and the Claude Code command that runs it.
    read: "`bin/macapp.mjs`, the comment on `launchPlan`"
  - name: Mac app
    code:
      - mac/
    summary: A Swift app that starts, restarts and stops the standalone server with the Node in its bundle, with one web view on it, a native view while it isn't answering, and the `backstory://` URL scheme, and Check for Updates… through Sparkle. `mac/dmg.sh` packs it into a notarized disk image, `mac/appcast.sh` writes the Sparkle appcast that offers it, and `.github/workflows/release.yml` runs both on a version tag.
    read: "`mac/backstory/Backstory/ServerState.swift`, the comment on `ServerState`"

invariants:
  - rule: Every read-modify-write of a store file runs inside `withStore`, and a batch is one write, not a loop of single-key writes.
