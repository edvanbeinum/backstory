# The words, building blocks and rules agents plan Backstory's changes with.

terms:
  - name: Backstory
    means: "The product: the Mac app, the server it runs, the page and the `backstory` command."
  - name: flow
    means: "What the code does for one user action a change touches: the data, a card in the story and the feature."
    drawing: sequence
    avoid:
      - sequence, for the data
      - trace as a noun (trace stays the verb, as in "Trace this change")
  - name: participant
    means: One actor in a flow, a type the calls go between (`FlowParticipant`, SARIF `logicalLocations`).
    drawing: lane
    avoid:
      - lane, for the data
  - name: view
    means: 'The two commits being compared: one commit and its first parent, or "All changes" from the fork point to the reviewed branch''s tip, HEAD unless the URL has `ref` (`lib/view.ts`). Uncommitted work is the working tree against HEAD, drawn on HEAD''s map.'
    avoid:
      - view, for the Diff / Before / After switch
  - name: flow mode
    means: The Diff / Before / After switch on a flow (`FlowMode` in `lib/flows/rows.ts`).
    avoid:
      - view
  - name: tab
    means: "One of the three views of a change under its header, as a pull request's tabs: Story, Files changed and Comments (`components/Tabs.tsx`). The open tab is in the URL."
    avoid:
      - pane
      - panel
      - column
  - name: story
    means: "The Story tab, where every view lands: the walk through the change, or with Show everything on one page the change description, then the map at full width with one line of what it says, then each flow as a card (`components/Story.tsx`). Story holds the map's, the data model's and the description's reads: one progress line at the top says which run, with each one's phase and step, a failed read's error and Try again, and a line for a big repo (`components/ReadLine.tsx`), except the map's running read, which the space the map will take shows instead, with a large spinner, the phase and step, and the big-repo line; one footnote at the bottom, once the AI drew anything, says who drew it and has Turn off and each drawing's Read again (`components/ReadFootnote.tsx`)."
    avoid:
      - strip, for the map or the data model's summary
  - name: walk
    means: "Story as it opens: the change one stop at a time under a pinned bar, with the map on each component stop outlining it, and no data phrase under it, since the data model has its own stop (`lib/walk.ts`, `components/Walk.tsx`). On uncommitted work, which has no description, the overview is the map. `stop=` in the URL names the stop, and `walk=0` opens Story on one page. The UI never says walk: it offers Walk me through it and Show everything on one page."
    avoid:
      - tour (reads as an app's onboarding tour)
  - name: stop
    means: "One part of the walk: the overview, the data model when it changed, one per changed component in the map's order, the files no component has, and the finish with your notes. Every changed file is in exactly one stop. The UI never says stop: its bar reads 3 of 6."
    avoid:
      - step (that's a flow's step, as in `1·3`)
  - name: gutter mark
    means: "A mark beside a line in Files changed: `⇄ 1·7` is flow 1, step 7, and opens it in the story; `💬 2` is review comment 2, and opens it in Comments."
    avoid:
      - chip, for the mark itself
  - name: Rails
    means: Ruby on Rails, one of the data readers.
    boundary: "`lib/data/` only"
    avoid:
      - rail, for any layout
  - name: data reader
    means: "One format a data model is read from: one entry in `DATA_READERS` (`lib/data/readers.ts`) and one file in `lib/data/`, such as `lib/data/rails.ts`."
    avoid: []
  - name: data steering
    means: "`data.files` and `data.format` in a workspace's properties: which files hold the data model, and which data reader reads them. Read at the head and used at both ends of a view."
    avoid: []
  - name: drafted data model
    means: "The AI provider's reading of a data model, for a repo no data reader understands (`lib/data/drafted.ts`). Main's data model is read in full once; every other commit's is derived forward from the nearest model already read, by one read of the patch between them. Read as repos and views open, unless the repo is turned off (Turn off in Story's footnote), or on a click (Read the data model). Read the data model again, in Story's footnote, reads main's data model in full again."
    avoid: []
  - name: main's data model
    means: "The drafted data model of the repo's default branch that every view's base is derived from, pointed at by `trunk.json` in the repo's data folder (`lib/data/cache.ts`). Read in full once, and moved forward when a view's base is on main past it."
    avoid:
      - trunk, in copy
  - name: data cache
    means: "`lib/data/cache.ts`: the drafted data models in `~/.backstory/data/`, one file per tree with the tree it was derived from, plus `trunk.json` for main's data model and the queue of reads that make them."
    avoid:
      - store
  - name: store
    means: "`lib/store.ts`: the SQLite database `~/.backstory/backstory.db` (in `homeDir`) that has notes and rounds, one table each, plus `seen`, `settings` and `looked`."
    avoid:
      - store, for the flow cache, the data cache or the map cache
  - name: flow cache
    means: "`lib/flows/cache.ts`: one cached SARIF file per view in `~/.backstory/flows/`, plus the queue of runs that make them."
    avoid:
      - store
  - name: local model
    means: "A C4 model written by hand on this machine for a repo that doesn't commit one, at `~/.backstory/models/<repo key>/workspace.dsl` (`localModelFile` in `lib/model.ts`). It wins over a drafted map, and Backstory never writes it. One with the `backstory.drafted` property is the old single drafted model, and is skipped. The UI calls it the hand-written map; the docs use that name for a committed model too."
    avoid:
      - draft alone, for the model
  - name: drafted map
    means: "The AI provider's C4 model of one tree, for a repo with no committed or local model: main's map is read in full once (`lib/models/draft.ts`); every other tree's is derived forward from the nearest map already read, by one read of the patch that returns only what it changed (`lib/models/delta.ts`). Base and head are compared like a committed model's, so the map marks what a branch added or removed. Uncommitted work is drawn on HEAD's map, so opening it reads HEAD's own view. Read as repos and views open, unless the repo is turned off (Turn off in Story's footnote), or on a click (Draw the map). With the repo turned off, the map card also has Read automatically, since the footnote only shows once something was drawn. Draw the map again, in Story's footnote, reads main in full again."
    avoid:
      - local model, for a drafted map
  - name: main's map
    means: "The drafted map of the repo's default branch that every view's base is derived from, pointed at by `trunk.json` in the repo's map folder (`lib/models/cache.ts`). Read in full once, and moved forward when a view's base is on main past it."
    avoid:
      - trunk, in copy
  - name: map cache
    means: "`lib/models/cache.ts`: the drafted maps in `~/.backstory/maps/`, one file per tree with the tree it was derived from, plus `trunk.json` for main's map and the queue of reads that make them. The data cache's engine, copied."
    avoid:
      - store
  - name: change description
    means: "A few plain sentences at the top of Story: why the change was made (only when its commit messages or PR say), what it does, and at most two places to look first, each outlining its component on the map when the name is one. The AI provider reads it from the view's patch, commit messages, PR and the names of the components and entities it touches (`lib/description/`), once per view, cached by base and head trees in `~/.backstory/descriptions/`. Read as views open unless the repo is turned off (Turn off in Story's footnote), or on a click (Describe this change). Describe again, in Story's footnote, reads it once more, and the earlier one stays if that read fails."
    avoid:
      - summary, for the description (that's the line under the map)
  - name: repo key
    means: "The folder a repo gets under `~/.backstory/flows/`, `data/`, `maps/`, `descriptions/` and `models/` (`repoKey` in `lib/git.ts`): the main checkout's folder plus the first 8 hex characters of a hash of the common git dir. Every worktree of a repo has the same key; two repos whose checkouts share a folder name don't."
    avoid: []
  - name: AI provider
    means: "The tool Backstory asks to read code and answer in a JSON schema; Claude Code for now, and required: it draws every map, data model, flow and change description, through the user's own login (`lib/ai/provider.ts`)."
    avoid:
      - agent (that's the coding agent under review, as in the agent review loop)
      - model, for the tool (that's the C4 or data model; the LLM is "the provider's model")
  - name: Mac app
    means: "The native app in `mac/` that owns the server: it starts Backstory's server from its bundle, shows the UI in a web view only while the server answers, and opens repos from `backstory://open?repo=` links."
    avoid:
      - shell (that's the command shell)
      - wrapper
  - name: attached
    means: "The Mac app showing a server it didn't start, through `-serverURL` or a build with no server in its bundle; the dev loop."
    avoid:
      - dev mode
      - override
  - name: setup checklist
    means: "The empty inbox's list of what Backstory needs on this machine (git, Claude Code, GitHub, notes to your agent), each with what it unlocks and a button for the fix (`components/SetupChecklist.tsx`, checked by `lib/setup.ts`). Git and Claude Code are marked needed; without Claude Code the Claude Code gate shows instead of the inbox. The Mac app's Set Up Backstory… brings it back at `/?setup=1`, and so does the Connect GitHub link on a repo or inbox notice. The GitHub row offers Connect GitHub, with `gh auth login` as the alternative. In the Mac app, the Notes to your agent row's Set Up adds the Claude Code Stop hook and `/backstory-review` (`mac/backstory/Backstory/ClaudeSetup.swift`), and its Remove… takes them out."
    avoid:
      - onboarding
      - wizard
  - name: Claude Code gate
    means: "The card Backstory shows in place of the inbox and the repo view while Claude Code is missing or signed out, with the Claude Code notice's button, or Couldn't check for Claude Code with Try again when `/api/ai` fails (`components/ClaudeCodeGate.tsx`). It checks again as the window comes back."
    avoid:
      - paywall
      - blocker
  - name: Connect GitHub
    means: "Signing Backstory in to GitHub without `gh`: the setup checklist's GitHub row shows a code from GitHub's device flow, the user approves it on github.com, and the token goes in the macOS Keychain (`lib/githubLogin.ts`, `app/api/github/login/route.ts`). Only offered when `gh` isn't signed in. Disconnect GitHub, in the Mac app's Backstory menu, deletes the token."
    avoid:
      - log in, for this (`gh auth login` is `gh`'s own sign-in)
      - OAuth, in copy
  - name: inbox
    means: "The home screen: the changes waiting for you, as every worktree and every branch with a pull request across the repos you've opened, each with its commits, files and lines against its base and when it last changed, the branches changed since you last looked first (`components/Inbox.tsx`, `buildInbox` in `lib/inbox.ts`)."
  - name: changed since you last looked
    means: "A branch whose tip isn't the one stored when you last opened it, with at least one commit past its base. Opening a branch, but not a background refresh, stores its tip (`markLooked` in `lib/looked.ts`, `POST /api/looked`). Never a merged or closed pull request, or the repo's own checkout on its default branch."
    avoid:
      - unread
      - reviewed
  - name: On GitHub
    means: "The inbox's fold under each repo listing the open pull requests and branches on GitHub this clone has no local branch for. Opening one fetches it into a local branch and reviews it (`onGitHub` in `lib/inbox.ts`)."
    avoid:
      - remote branches, in copy
  - name: Fetch
    means: "Bringing a reviewed branch up to date with origin into a local branch of the same name, by opening it from On GitHub or with the workspace's Fetch button (`lib/fetch.ts`, `POST /api/fetch`)."
    avoid:
      - pull (that merges into a checkout, which Fetch never touches)
      - sync
  - name: primitive
    means: A named capability Backstory exposes for reuse, listed in `architecture/primitives.yaml`.
    avoid:
      - helper or utility, for a primitive (a helper is private to one file)

blocks:
  - name: git reader
    code:
      - lib/git.ts
      - lib/exec.ts
      - lib/browse.ts
      - lib/pushed.ts
      - lib/view.ts
      - lib/fetch.ts
      - app/api/fetch/
    summary: Reads repos, commits, patches and the working tree through git, works out what counts as not yet pushed, and fetches a branch from origin into a local branch.
    read: '`lib/git.ts` header, then docs/how-it-works.md "How "not yet pushed" is decided"'
  - name: diff and anchors
    code:
      - lib/diff.ts
      - lib/anchor.ts
      - lib/highlight.ts
      - lib/snippet.ts
    summary: Parses and highlights diffs, and puts each review thread on the line it was written against.
    read: "`lib/anchor.ts`, the comment on `anchorThreads`"
  - name: GitHub
    code:
      - lib/github.ts
      - lib/githubLogin.ts
      - lib/inbox.ts
      - app/api/github/
    summary: Pull requests and review threads through a token in the Keychain, or `gh`, degrading to "unavailable" rather than failing. Connect GitHub's sign-in, and Disconnect GitHub.
    read: '`lib/github.ts` header, then docs/how-it-works.md "The inbox"'
  - name: store
    code:
      - lib/store.ts
      - lib/schema.sql
      - lib/upgrades/
      - lib/notes.ts
      - lib/outbox.ts
      - lib/looked.ts
      - app/api/looked/
    summary: The SQLite database `~/.backstory/backstory.db` and the modules that keep its records.
    read: "`lib/store.ts` header"
  - name: flow engine
    code:
      - lib/flows/
    summary: Traces a view's flows with the AI provider, checks each step against its line, and caches the result.
    read: '`lib/flows/generate.ts` header, then docs/using-backstory.md "The map, flows and the data model"'
  - name: AI provider
    code:
      - lib/ai/
    summary: "The one seam every AI call goes through, for the map's and the data model's drafts, flows and the change description: picks the provider (`BACKSTORY_AI`, Claude Code by default) and holds the contract a provider must meet, reading a directory read-only and answering in a JSON schema."
    read: "`lib/ai/provider.ts` header"
  - name: change description
    code:
      - lib/description/
      - app/api/description/
    summary: Has the AI provider describe a view's change in a few plain sentences, under writing rules that keep them specific, and caches it per view.
    read: "`lib/description/cache.ts` header"
  - name: model reader (the map)
    code:
      - lib/dsl.ts
      - lib/model.ts
      - lib/map.ts
      - lib/mapGroups.ts
      - lib/models/
    summary: Reads the repo's C4 model from its Structurizr DSL and marks the components a change touched, added or removed, drawing each component inside its container's box and each container inside its system's. Has the AI provider draft a map for a repo with none, main's once and each view's forward from it.
    read: "`lib/model.ts` header"
  - name: data model reader
    code:
      - lib/data/
    summary: Reads the data model at both ends of a view and diffs it, with the first data reader that finds one, or the drafted data model.
    read: '`lib/data/build.ts` header, then docs/using-backstory.md "The map, flows and the data model"'
  - name: agent review loop
    code:
      - lib/review.ts
      - lib/feedback.ts
      - lib/outbox.ts
      - bin/hook.mjs
    summary: Notes on an agent's work, sent to a waiting `backstory review` or queued for the agent's Stop hook.
    read: 'docs/using-backstory.md "Reviewing an agent''s work"'
  - name: setup
    code:
      - lib/setup.ts
      - app/api/setup/
      - app/api/ai/
    summary: "Checks what Backstory needs on this machine (git, Claude Code, GitHub through Connect GitHub's token or `gh`, and the agent review Stop hook), and only looks, except that it forgets a saved GitHub token GitHub refuses. `/api/ai` answers the Claude Code gate."
    read: "`lib/setup.ts` header"
  - name: live updates
    code:
      - app/api/watch/
      - components/useStaleReload.ts
    summary: Watches the worktree and git dir and pushes change events to the window over SSE.
    read: "`app/api/watch/route.ts` header"
  - name: UI tabs
    code:
      - app/page.tsx
      - components/
      - lib/recents.ts
      - lib/walk.ts
    summary: The page, the change's header and its three tabs (Story, which opens as a walk through the change, Files changed and Comments), and the recent repos kept in the browser's localStorage.
    read: "`components/Story.tsx`, the comment on `Story`"
  - name: CLI
    code:
      - bin/backstory.mjs
      - bin/macapp.mjs
      - bin/claude-setup.mjs
      - packaging/
    summary: The `backstory` command, which opens a repo in the Mac app (launching it when it isn't running) or `backstory review`'s wait for notes, and the Claude Code command that runs it. `backstory setup claude` adds the Stop hook and that command to `~/.claude`, naming the command in the Mac app by its path, and takes them out again. The command reaches a terminal through the `/usr/local/bin/backstory` link the Mac app's Install Command Line Tool… makes.
    read: "`bin/macapp.mjs`, the comment on `launchPlan`"
  - name: Mac app
    code:
      - mac/
    summary: A Swift app that starts, restarts and stops the standalone server with the Node in its bundle, with one web view on it, a native view while it isn't answering, and the `backstory://` URL scheme, and Check for Updates… through Sparkle. Its bundle carries the `backstory` command too (`mac/bin/backstory`, run by the bundled Node), which the Claude Code hook runs by its path there. Install Command Line Tool… in the Backstory menu links `/usr/local/bin/backstory` to it, or fixes or removes that link (`mac/backstory/Backstory/CommandLineTool.swift`). Disconnect GitHub, under it, asks the server to delete Connect GitHub's token. `mac/dmg.sh` packs it into a notarized disk image, `mac/appcast.sh` writes the Sparkle appcast that offers it, and `.github/workflows/release.yml` runs both on a version tag.
    read: "`mac/backstory/Backstory/ServerState.swift`, the comment on `ServerState`"

invariants:
  - rule: Every write that touches more than one row runs inside `transaction`, and a batch is one transaction.
